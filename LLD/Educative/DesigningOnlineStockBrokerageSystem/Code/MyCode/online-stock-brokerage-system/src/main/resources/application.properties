spring.application.name=Online Stock Brokerage System

# Server Configuration
server.port=8080

# H2 Database Configuration (Development/Testing)
spring.datasource.url=jdbc:h2:mem:stockdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update # Create/update tables on startup
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true