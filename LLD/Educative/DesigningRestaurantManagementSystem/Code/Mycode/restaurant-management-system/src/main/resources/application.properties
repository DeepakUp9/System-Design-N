# ============================================
# 1. DATABASE CONFIGURATION (PostgreSQL)
# ============================================

# Database connection URL
spring.datasource.url=jdbc:postgresql://localhost:5432/rms_db

# Database credentials
spring.datasource.username=rms_user
spring.datasource.password=rms_password

# JDBC driver class
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool settings
# HikariCP is the default pool and is highly scalable/resilient
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# ============================================
# 2. JPA/HIBERNATE CONFIGURATION
# ============================================

# Hibernate DDL strategy
# Use 'none' or 'validate' for production, not 'update' or 'create-drop'
# Flyway will manage schema changes, Hibernate should only validate.
spring.jpa.hibernate.ddl-auto=validate

# Don't show SQL in logs (turn off in prod for performance)
spring.jpa.show-sql=false

# Hibernate properties
spring.jpa.properties.hibernate.format_sql=false
# Essential for resilience against database errors
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# 3. FLYWAY DATABASE MIGRATION CONFIGURATION
# ============================================

# Flyway is enabled by default if flyway-core is on the classpath
spring.flyway.enabled=true

# For first-time setup on an empty database
spring.flyway.baseline-on-empty=true

# Location of migration scripts
spring.flyway.locations=classpath:db/migration

# ============================================
# 4. WEB CONFIGURATION
# ============================================

# Consistent locale for pricing/date formats
spring.web.locale=en_US

# ============================================
# 5. SERVER CONFIGURATION
# ============================================

# Port the application runs on
server.port=8080

# Ensures resilience by handling incoming requests gracefully
server.shutdown=graceful

# ============================================
# 6. APPLICATION-SPECIFIC PROPERTIES
# ============================================

# Configuration for multi-branch operation
rms.branches.default-branch-id=1
rms.branches.max-concurrent-orders=1000