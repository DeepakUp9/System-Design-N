apiVersion: v1
kind: Service
metadata:
  name: espn-cricinfo-service
  labels:
    app: espn-cricinfo
    component: application
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: management
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: espn-cricinfo
    component: application
---
apiVersion: v1
kind: Service
metadata:
  name: espn-cricinfo-headless
  labels:
    app: espn-cricinfo
    component: application
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: espn-cricinfo
    component: application
