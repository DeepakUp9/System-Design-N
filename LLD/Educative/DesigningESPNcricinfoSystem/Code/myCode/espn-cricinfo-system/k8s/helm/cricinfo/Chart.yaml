apiVersion: v2
name: espn-cricinfo
description: A Helm chart for ESPN Cricinfo cricket scoring system
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - cricket
  - scoring
  - sports
  - espn
  - kubernetes
home: https://github.com/espn/cricinfo
sources:
  - https://github.com/espn/cricinfo
maintainers:
  - name: ESPN Cricinfo Team
    email: team@cricinfo.com
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: kafka
    version: "21.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
  - name: elasticsearch
    version: "19.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: elasticsearch.enabled
