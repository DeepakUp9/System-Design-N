version: '3.8'

# Override file for local development with enhanced tooling
services:
  postgres:
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=cricinfo_dev
      - POSTGRES_USER=cricinfo
      - POSTGRES_PASSWORD=cricinfo123

  redis:
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  kafka:
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
      - "5005:5005"  # Debug port
    environment:
      - SPRING_PROFILES_ACTIVE=dev,docker
      - JAVA_OPTS=-Xmx1g -Xms512m -XX:+UseContainerSupport -Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=*:5005
    volumes:
      - .:/app:cached
      - ~/.m2:/root/.m2:cached
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - kafka

  # Enhanced PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: cricinfo-pgadmin
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@cricinfo.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cricinfo-network

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cricinfo-redis-commander
    depends_on:
      - redis
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis
    networks:
      - cricinfo-network

  # Kafka UI for topic and message management
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cricinfo-kafka-ui
    depends_on:
      - kafka
      - zookeeper
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      - KAFKA_CLUSTERS_0_READONLY=false
    networks:
      - cricinfo-network

  # Elasticsearch for centralized logging
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: cricinfo-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=cricinfo123
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - cricinfo-network

  # Kibana for log visualization
  kibana:
    image: kibana:8.11.0
    container_name: cricinfo-kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - cricinfo-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: cricinfo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - cricinfo-network

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: cricinfo-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - cricinfo-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
