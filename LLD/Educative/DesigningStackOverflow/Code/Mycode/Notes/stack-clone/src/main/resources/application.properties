# ============================================================================
# 1. SPRING GENERAL CONFIGURATION
# ============================================================================

# Name of our application (like giving your app a nickname)
spring.application.name=stack-clone-lld

# Which environment we're running in (dev for development on your computer)
spring.profiles.active=dev

# ============================================================================
# 2. DATABASE CONFIGURATION - POSTGRESQL SETUP
# ============================================================================

# Database connection URL
# Format: jdbc:postgresql://[server]:[port]/[database_name]
# localhost means "this computer"
# 5432 is PostgreSQL's default port (like a door number)
# stackdb is the name of our database
spring.datasource.url=jdbc:postgresql://localhost:5432/stackdb

# Database login username
spring.datasource.username=stackuser

# Database login password (CHANGE THIS!)
spring.datasource.password=strongpassword

# Tells Spring which database driver to use
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# DATABASE CONFIGURATION - JPA/HIBERNATE (Updated with Flyway)
# ============================================================================

# ----------------------------------------------------------------------------
# JPA/HIBERNATE SETTINGS
# ----------------------------------------------------------------------------

# Disable automatic table creation/updates (SAFER for production!)
# 'none' means Hibernate won't touch your database schema at all
# Why? We're using Flyway instead for controlled, versioned migrations
# How Hibernate handles database tables
# 'update' = creates/updates tables automatically (good for development)
# WARNING: In production, use 'validate' or 'none' instead!
spring.jpa.hibernate.ddl-auto=none

# Don't show SQL queries in console (performance/security)
# Should we show SQL queries in console? false = no (better for performance)
spring.jpa.show-sql=false

# Format SQL queries nicely when they ARE logged (easier to read)
spring.jpa.properties.hibernate.format_sql=true

# Group database operations for better performance
# Instead of 20 separate database calls, make 1 call with 20 operations
# How many database operations to group together (makes things faster)
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ----------------------------------------------------------------------------
# FLYWAY CONFIGURATION (Database Migration Tool)
# ----------------------------------------------------------------------------

# Enable Flyway (turns on the migration system)
spring.flyway.enabled=true

# Where to find SQL migration files
# classpath: = look in src/main/resources folder
# db/migration = specific folder for migration scripts
spring.flyway.locations=classpath:db/migration

# What to do if Flyway finds a non-empty database without Flyway's tracking table
# true = automatically create baseline version (useful for existing databases)
spring.flyway.baseline-on-migrate=true

# Optional but recommended settings (add these too):
# --------------------------------------------------
# Validate Flyway migrations on startup (checks for corruption)
# spring.flyway.validate-on-migrate=true

# Allow mixing of SQL and Java-based migrations
# spring.flyway.mixed=true

# The prefix for SQL migration files (V1__Create_users_table.sql, V2__Add_indexes.sql)
# spring.flyway.sql-migration-prefix=V

# Separator between version and description (two underscores)
# spring.flyway.sql-migration-separator=__

# ============================================================================
# 4. FILE UPLOAD CONFIGURATION
# ============================================================================

# Maximum size for a single uploaded file (like user profile pictures)
spring.servlet.multipart.max-file-size=10MB

# Maximum size for entire request including files
spring.servlet.multipart.max-request-size=10MB

# ============================================================================
# 5. MONITORING CONFIGURATION (Spring Boot Actuator)
# ============================================================================

# Show detailed health information (like a doctor's report for your app)
management.endpoint.health.show-details=always

# Which monitoring endpoints to expose
# health = app health status
# info = app information
# prometheus = metrics for monitoring tools
management.endpoints.web.exposure.include=health,info,prometheus

# ============================================================================
# 6. LOGGING CONFIGURATION (App Diary/Journal)
# ============================================================================

# What level of messages to log
# root = everything, INFO = normal operation messages
logging.level.root=INFO

# Web layer logging level
logging.level.org.springframework.web=INFO

# Our own application's logging level (more detailed for debugging)
logging.level.com.stackclonell=DEBUG

# Format for log messages in console
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Pattern that includes tracing info (for debugging multiple requests)
logging.pattern.level=%5p [${spring.application.name},%X{traceId},%X{spanId}]

# Save logs to a file (not just console)
logging.file.name=logs/stack-clone-lld.log


# ============================================================================
# DATABASE CONNECTION POOLING CONFIGURATION
# (This replaces or adds to your existing datasource section)
# ============================================================================

# ----------------------------------------------------------------------------
# CONNECTION POOL TYPE (HikariCP - Fastest connection pool for Java)
# ----------------------------------------------------------------------------

# Explicitly tell Spring to use HikariCP as connection pool
# Why? HikariCP is like having a "taxi stand" for database connections
# Instead of calling Uber each time, you have taxis waiting and ready!
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# ----------------------------------------------------------------------------
# HIKARI CONNECTION POOL SETTINGS
# ----------------------------------------------------------------------------

# Maximum number of database connections in the pool
# Like having 20 taxis in your taxi stand maximum
# Why 20? For Stack Overflow: Balance between performance and server resources
# More connections = more concurrent users, but more memory/RAM usage
spring.datasource.hikari.maximum-pool-size=20

# Minimum number of idle connections always kept open
# Like having 5 taxis always waiting, even when no one needs them
# Why? Faster response when users suddenly arrive
spring.datasource.hikari.minimum-idle=5

# How long an idle connection stays in pool before being closed (in milliseconds)
# If a taxi waits 30 seconds with no passengers, it goes home
# 30,000ms = 30 seconds
spring.datasource.hikari.idle-timeout=30000

# Maximum time to wait for a connection from the pool (in milliseconds)
# How long a user waits for a taxi before giving up
# 20,000ms = 20 seconds (prevent infinite waiting!)
spring.datasource.hikari.connection-timeout=20000

# Name for this connection pool (for monitoring)
# Like giving your taxi company a name - "StackClone Taxis"
spring.datasource.hikari.pool-name=StackCloneCP

# ----------------------------------------------------------------------------
# RECOMMENDED ADDITIONAL SETTINGS (Add these too!)
# ----------------------------------------------------------------------------

# Maximum lifetime of a connection in the pool (in milliseconds)
# How long before we retire a taxi and get a new one
# 600,000ms = 10 minutes (prevents stale connections)
spring.datasource.hikari.max-lifetime=600000

# Test connection validity when borrowing from pool
# Like checking if taxi has fuel before giving to customer
spring.datasource.hikari.connection-test-query=SELECT 1

# Validate connections when they're idle
# Check taxi every 30 seconds to make sure it's still working
spring.datasource.hikari.validation-timeout=5000

# How often to check for idle connections (in milliseconds)
# Manager checks taxi stand every 30 seconds
spring.datasource.hikari.leak-detection-threshold=30000

# Time zone for database connections (important for timestamps!)
# Make sure all taxis use the same clock
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'


spring.profile.active=dev