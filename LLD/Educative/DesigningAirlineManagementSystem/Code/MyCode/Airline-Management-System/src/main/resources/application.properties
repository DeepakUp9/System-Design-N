spring.application.name=Airline-Management-System

# ============================================
# RESILIENCE4J CIRCUIT BREAKER CONFIGURATION
# ============================================

# ENABLE RESILIENCE4J
resilience4j.circuitbreaker.enabled=true

# SPECIFIC CIRCUIT BREAKER INSTANCE: flightUpdateService
# This matches @CircuitBreaker(name = "flightUpdateService")
resilience4j.circuitbreaker.instances.flightUpdateService.sliding-window-size=10
resilience4j.circuitbreaker.instances.flightUpdateService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.flightUpdateService.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.flightUpdateService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.flightUpdateService.minimum-number-of-calls=5

# SLOW CALL CONFIG (Optional but useful)
resilience4j.circuitbreaker.instances.flightUpdateService.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.flightUpdateService.slow-call-duration-threshold=2s

# AUTOMATIC TRANSITION (Optional)
resilience4j.circuitbreaker.instances.flightUpdateService.automatic-transition-from-open-to-half-open-enabled=true

# EVENT CONSUMERS (Optional - for logging)
resilience4j.circuitbreaker.instances.flightUpdateService.register-health-indicator=true
resilience4j.circuitbreaker.instances.flightUpdateService.event-consumer-buffer-size=10

# ============================================
# SPRING AOP CONFIGURATION (REQUIRED!)
# ============================================
spring.aop.auto=true
spring.aop.proxy-target-class=true

# ============================================
# ACTUATOR FOR MONITORING (Optional)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

