# ----------------------------------------------------------------------
# Application Configuration for Catalog Service
# ----------------------------------------------------------------------

# Server port
server.port=8080

# Spring application name
spring.application.name=catalog-service

# --- 1. Database Configuration (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/amazon_catalog_db
spring.datasource.username=catalog_user
spring.datasource.password=secure_password
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=CatalogHikariPool

# --- 2. JPA/Hibernate Configuration ---
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# --- 3. Actuator/Monitoring Configuration ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# --- 4. Custom Resilience/Business Configuration ---
catalog.cache.ttl-seconds=3600
