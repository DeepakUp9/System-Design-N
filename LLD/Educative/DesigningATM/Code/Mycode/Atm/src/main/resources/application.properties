spring.application.name=atm-design-system

# =========================================
# STEP 1: DATABASE CONFIGURATION (PostgreSQL)
# =========================================
# Set up database connection details
spring.datasource.url=jdbc:postgresql://localhost:5432/atm_db
spring.datasource.username=atm_user
spring.datasource.password=atm_password
spring.datasource.driver-class-name=org.postgresql.Driver


# Jpa / Hibernate Configuration
# ddl-auto: 'none' is production-safe. We define the schema manually (schema_design.sql)
# For development, you could use 'update' or 'create-drop'
spring.jpa.hibernate.ddl-auto=update


# JPA - FORCE TABLE CREATION
spring.jpa.defer-datasource-initialization=true

# REMOVE schema for now - let Hibernate use public schema
# spring.jpa.properties.hibernate.default_schema=atm_system

# SQL initialization
spring.sql.init.mode=always





# Show SQL for debugging/learning (turn off for pure production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# General Application Settings
# =========================================
server.port=8080


# =========================================
# STEP 8: SECURITY & RATE LIMITING CONFIGURATION
# =========================================

# The static key that the ATM hardware client must send in the header (e.g., X-API-Key)
atm.security.api-key=aTm_PrOdUcTiOn_S3cr3t_K3Y_2025

# Rate Limiting: Max requests per time window per unique IP address
atm.rate-limit.max-requests=10
# Time window in milliseconds (e.g., 60000ms = 1 minute)
atm.rate-limit.time-window-ms=60000 

