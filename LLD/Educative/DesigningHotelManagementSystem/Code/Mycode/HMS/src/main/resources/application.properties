spring.application.name=HMS

# --- Database Configuration (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/hms_db
spring.datasource.username=hms_user
spring.datasource.password=secure_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update  # Automatically update the schema
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Logging Configuration ---
logging.level.com.hms=INFO
logging.level.org.springframework=WARN

# --- Server Port ---
server.port=8080


# --- jwt token ---
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566A5970337336763979244226452948404D6351645467576A5A357238753278412F442A462D4A614E645267556B58703273357638792F423F4550484D
application.security.jwt.expiration=86400000 # 24 hours

# ---- Enable detailed validation messages ---
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


# ----  Production connection pool ---
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000